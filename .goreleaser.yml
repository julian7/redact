version: 2
archives:
- files:
  - README.md
  - CHANGELOG.md
  - LICENSE-BlueOak.md
  - LICENSE-MIT.md
  ids:
  - redact
  - redact-ext-aws
  - redact-ext-azure
  - redact-ext-gpg
  - redact-ext-age
  formats: tgz
  format_overrides:
  - goos: windows
    formats: zip
  name_template: "{{.ProjectName}}-{{.Os}}-{{.Arch}}-{{.Version}}"
builds:
- id: redact
  env: &env
  - CGO_ENABLED=0
  ldflags: &ldflags
  - -s -w -X main.version={{.Version}}
  main: ./cmd/redact
  targets: &targets
  - darwin_arm64
  - darwin_amd64
  - linux_amd64
  - linux_arm64
  - windows_amd64
  flags:
  - -trimpath
- id: redact-ext-aws
  binary: redact-ext-aws
  main: ./cmd/redact-ext-aws
  env: *env
  ldflags: *ldflags
  targets: *targets
- id: redact-ext-azure
  binary: redact-ext-azure
  main: ./cmd/redact-ext-azure
  env: *env
  ldflags: *ldflags
  targets: *targets
- id: redact-ext-gpg
  binary: redact-ext-gpg
  main: ./cmd/redact-ext-gpg
  env: *env
  ldflags: *ldflags
  targets: *targets
- id: redact-ext-age
  binary: redact-ext-age
  main: ./cmd/redact-ext-age
  env: *env
  ldflags: *ldflags
  targets: *targets
checksum:
  name_template: 'SHA256SUMS.{{.ProjectName}}-{{.Version}}'
  algorithm: sha256
project_name: redact
release:
  github:
    name: redact
    owner: julian7
snapshot:
  version_template: "{{ .Tag }}-{{ .ShortCommit }}"
universal_binaries:
- id: redact
  replace: true
- id: redact-ext-aws
  name_template: "redact-ext-aws"
  replace: true
- id: redact-ext-azure
  name_template: "redact-ext-azure"
  replace: true
- id: redact-ext-gpg
  name_template: "redact-ext-gpg"
  replace: true
- id: redact-ext-age
  name_template: "redact-ext-age"
  replace: true
